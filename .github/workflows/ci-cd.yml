name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build UMonsPlanning.slnx --nologo --no-restore
      - run: dotnet test --solution UMonsPlanning.slnx --no-build
      - run: dotnet format --verify-no-changes

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-frontend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: src/UMonsPlanning.Frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/UMonsPlanning.Frontend/package.json
          cache: npm
          cache-dependency-path: src/UMonsPlanning.Frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy-test:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    concurrency:
      # No cancel-in-progress: this job toggles app_offline.htm on the server around the deploy —
      # cancelling it mid-run could leave the site stuck in maintenance mode. A newer push queues
      # behind the current deploy instead of aborting it.
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/UMonsPlanning.Frontend/package.json
          cache: npm
          cache-dependency-path: src/UMonsPlanning.Frontend/package-lock.json

      - name: Publish backend
        run: dotnet publish src/UMonsPlanning.Backend -c Release -o publish

      - name: Build frontend
        # "staging" swaps in environment.staging.ts (fileReplacements, angular.json) so this build
        # alone renders the test-only watermark (docs/adr/0011) - the prod job below stays plain
        # "npm run build" (defaultConfiguration "production", no watermark).
        working-directory: src/UMonsPlanning.Frontend
        run: |
          npm ci
          npm run build -- --configuration=production,staging

      - name: Merge frontend into the backend's wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r src/UMonsPlanning.Frontend/dist/UMonsPlanning.Frontend/browser/. publish/wwwroot/

      - name: Seed the maintenance-mode marker file
        # Must sit at the site root (next to web.config), not under wwwroot: this is what
        # "Enter/Leave maintenance mode" below renames to/from app_offline.htm, and what ANCM
        # watches for at the root to take the app offline and release its file locks (see
        # docs/adr/0010). Placing it under wwwroot instead silently no-ops that toggle forever.
        run: cp deploy/_app_offline.htm publish/_app_offline.htm

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Enter maintenance mode
        id: maintenance-on
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          LFTP_OPTS="set ftp:ssl-force yes; set ssl:verify-certificate no;"
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP_OPTS ls app_offline.htm; bye" "ftp://$FTP_HOST" 2>/dev/null | grep -q "app_offline.htm"; then
            # Already in maintenance mode (started manually, or a previous deploy never completed) - leave it alone.
            echo "already_offline=true" >> "$GITHUB_OUTPUT"
          elif lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP_OPTS ls _app_offline.htm; bye" "ftp://$FTP_HOST" 2>/dev/null | grep -q "_app_offline.htm"; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP_OPTS mv _app_offline.htm app_offline.htm; bye" "ftp://$FTP_HOST"
            echo "already_offline=false" >> "$GITHUB_OUTPUT"
          else
            # First deploy ever (or the file was removed): nothing to toggle, nothing to restore afterward.
            echo "already_offline=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          LFTP_OPTS="set ftp:ssl-force yes; set ssl:verify-certificate no; set mirror:parallel-transfer-count 1;"
          # --ignore-time: the local files are freshly built on every run (fresh mtimes) even when
          # their content is unchanged, so time-based comparison would re-upload everything every
          # time; comparing by size only actually skips files that haven't changed since the last
          # deploy, which is what makes this fast.
          # App_Data/ is excluded from both sync and --delete: it holds the catalog cache directory
          # that IIS's app pool needs write access to (see CLAUDE.md §12) and never exists in the
          # local publish/ output, so without this exclusion --delete would wipe it on every deploy.
          MIRROR_CMD="$LFTP_OPTS mirror --reverse --delete --no-perms --ignore-time --verbose --exclude-glob app_offline.htm --exclude-glob 'App_Data/' publish/ /; bye"
          # Retried: right after app_offline.htm takes effect, IIS's in-process hosting can take a
          # few seconds to release its lock on the app's own assemblies, which fails their transfer
          # with FTP error 550 - retrying a few seconds later succeeds once the lock clears.
          for attempt in 1 2 3; do
            if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$MIRROR_CMD" "ftp://$FTP_HOST"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Leave maintenance mode
        if: always() && steps.maintenance-on.outputs.already_offline == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # The mirror above re-deposits _app_offline.htm: its local source no longer matches a
          # same-named remote file once this run's "Enter maintenance mode" renamed the original
          # away. Remove that stray copy first, or the rename below collides with it (observed:
          # FTP 550, renaming onto an existing destination leaves the site stuck in maintenance).
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set ftp:ssl-force yes; set ssl:verify-certificate no; rm _app_offline.htm; mv app_offline.htm _app_offline.htm; bye" "ftp://$FTP_HOST"

  deploy-prod:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      # Same reasoning as deploy-test: never cancel a deploy mid-way, queue behind it instead.
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/UMonsPlanning.Frontend/package.json
          cache: npm
          cache-dependency-path: src/UMonsPlanning.Frontend/package-lock.json

      - name: Publish backend
        run: dotnet publish src/UMonsPlanning.Backend -c Release -o publish

      - name: Build frontend
        working-directory: src/UMonsPlanning.Frontend
        run: |
          npm ci
          npm run build

      - name: Merge frontend into the backend's wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r src/UMonsPlanning.Frontend/dist/UMonsPlanning.Frontend/browser/. publish/wwwroot/

      - name: Seed the maintenance-mode marker file
        # Must sit at the site root (next to web.config), not under wwwroot: this is what
        # "Enter/Leave maintenance mode" below renames to/from app_offline.htm, and what ANCM
        # watches for at the root to take the app offline and release its file locks (see
        # docs/adr/0010). Placing it under wwwroot instead silently no-ops that toggle forever.
        run: cp deploy/_app_offline.htm publish/_app_offline.htm

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Enter maintenance mode
        id: maintenance-on
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          LFTP_OPTS="set ftp:ssl-force yes; set ssl:verify-certificate no;"
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP_OPTS ls app_offline.htm; bye" "ftp://$FTP_HOST" 2>/dev/null | grep -q "app_offline.htm"; then
