@if (isTestEnvironment) {
  <div class="test-watermark" aria-hidden="true"></div>
}

<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:shadow-lg"
>
  Aller au contenu principal
</a>

<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
    <a
      routerLink="/"
      class="flex items-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
    >
      <img
        ngSrc="logo-horizontal-header.webp"
        alt="UMonsPlanning"
        width="220"
        height="32"
        priority
        class="h-8 w-auto"
      />
    </a>
    <nav aria-label="Navigation principale">
      <a
        routerLink="/aide"
        class="inline-flex items-center rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:text-brand-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-600"
      >
        Aide
      </a>
    </nav>
  </div>
</header>

<main id="main-content" class="mx-auto max-w-3xl px-4 py-8 sm:py-12">
  <router-outlet />
</main>

<footer class="mt-12 border-t border-slate-200 py-6 text-center text-sm text-slate-500">
  <nav aria-label="Pied de page" class="flex flex-wrap justify-center gap-4">
    <a
      routerLink="/"
      class="hover:text-brand-600 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-600"
    >
      Accueil
    </a>
    <a
      routerLink="/aide"
      class="hover:text-brand-600 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-600"
    >
      Aide
    </a>
    <a
      href="https://github.com/vpellichero/umonsplanning"
      target="_blank"
      rel="noopener noreferrer"
      class="hover:text-brand-600 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-600"
    >
      Code source sur GitHub
    </a>
  </nav>
  <p class="mt-3">Outil personnel non officiel, basé sur l'espace invité PRONOTE de l'UMONS.</p>
</footer>

<app-legal-disclaimer-dialog />
